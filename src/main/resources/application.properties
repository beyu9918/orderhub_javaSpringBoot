spring.application.name=orderhub
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderhub}
spring.datasource.username=${DB_USERNAME:orderhub}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.jackson.time-zone=UTC
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
orderhub.jwt.secret=${JWT_SECRET}
orderhub.jwt.ttl-seconds=7200
orderhub.cache.enabled=${CACHE_ENABLED:true}
orderhub.admin.username=${ADMIN_USERNAME:}
orderhub.admin.password=${ADMIN_PASSWORD:}
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.swagger-ui.path=/swagger-ui.html
